<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="css/style.css">
        <script src="js/main.js" async defer></script>
    </head>
    <body>
        <nav>
            <h1>Encoded Forge</h1>
        </nav>
        <main>
            <div class="loading-bg hide" id="loading-bg">
            <div class="loading-content">
                <div class="loading-text-container">
                    <p id="loading-text">loading</p>
                </div>
                <div class="loading-spinner-container">
                    <img src="/img/spinner.svg" width="80" height="80" alt="">
                </div>
            </div>

        </div>
        <div class="video-info-container">
            <div class="video-image">
                <img id="screenshot" width="640" />
            </div>
            <div class="video-info">
                
            </div>
        </div>
        <form enctype="multipart/form-data" id="form">
                <input type="file" name="filesForm" multiple accept="video/* video/mkv"  id="filesForm" hidden>
            <button id="upload-button" class="upload-button"><img src="/img/upload.svg" width="20" height="20" alt=""> Upload File</button>
            <div id="generated-blocks-container">

            </div>
            <label for="locationForm">Location:
                <input type="text" name="locationForm" id="locationForm">
            </label>
            <div>
                <p>Command:</p>
                <p>'-i temp/${file} -map 0:0 -map 0:1 -c copy temp/new${file}'</p>
            </div>
            <input type="button" value="Submit" id="submit">
        </form>
        <div>
            <canvas id="canvas" style="border:1px solid #000"></canvas>
        </div>
        </main>
        <footer>

        </footer>
    </body>
</html>
