<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="css/style.css">
        <script type="module" src="js/main.js" async defer></script>
    </head>
    <body>
        <nav>
            <h1>Encoded Forge</h1>
        </nav>
        <main>
            <div class="loading-bg hide" id="loading-bg">
            <div class="loading-content">
                <div class="loading-text-container">
                    <p id="loading-text">loading</p>
                </div>
                <div class="loading-spinner-container">
                    <img src="/img/spinner.svg" width="80" height="80" alt="">
                </div>
            </div>

        </div>
        <div class="video-info-container">
            <div class="video-image">
                <img src="" width="640" id="screenshot" alt="">
            </div>
            <div class="video-info">
                
            <div class="video-name video-info-block">
                <p class="video-name-p"></p>
                <p class="info-label">Name:</p>
            </div>
            <div class="video-hxl video-info-block">
                <p class="video-hxl-p"></p>
                <p class="info-label">Dimensions:</p>
            </div>
            <div class="video-ext video-info-block">
                <p class="video-ext-p"></p>
                <p class="info-label">Extension:</p>
            </div>
            <div class="video-ratio video-info-block">
                <p class="video-ratio-p"></p>
                <p class="info-label">Aspect Ratio:</p>
            </div>
            <div class="video-streams video-info-block">
                <p class="video-streams-p"></p>
                <p class="info-label">Streams:</p>
            </div>
            <div class="video-length video-info-block">
                <p id="video-duration" class="video-length-p"></p>
                <p class="info-label">Duration:</p>
            </div>
            <div class="video-size video-info-block">
                <p class="video-size-p"></p>
                <p class="info-label">Size:</p>
            </div>
        </div>
        </div>


        <form enctype="multipart/form-data" id="form">
                <input type="file" name="filesForm" multiple accept="video/* video/mkv"  id="filesForm" hidden>
            <button id="upload-button" class="upload-button"><img src="/img/upload.svg" width="20" height="20" alt=""> Upload File</button>
            <div class="streams-selecting-button-div">
                <button class="all-selection">Deselect All</button>
            </div>
            <div id="generated-blocks-container">

            </div>
            <label for="locationForm">Location:
                <input type="text" name="locationForm" id="locationForm">
            </label>
            <label for="locationForm">Name:
                <input type="text" name="nameForm" id="nameForm">
            </label>
            <div>
                <p>Command:</p>
                <p>'-i temp/${file} -map 0:0 -map 0:1 -c copy temp/new${file}'</p>
            </div>
            <input type="button" value="Submit" id="submit">
        </form>
        <div>
            <canvas id="canvas" style="border:1px solid #000"></canvas>
        </div>
        </main>
        <footer>

        </footer>
    </body>
</html>
